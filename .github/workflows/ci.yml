name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Données et schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validation du schéma, des vocabulaires et des quotas
        run: npm run validate
      - name: Tests unitaires
        run: npm test

  build:
    name: Construction du site
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Construction des images dérivées
        run: npm run media:build
      - name: Build Astro
        run: npx astro build
      - name: Page de crédits
        run: npm run media:credits
      - name: Vérifier que CREDITS.md est à jour
        run: git diff --exit-code CREDITS.md || (echo "CREDITS.md n'est pas à jour, relancer npm run media:credits" && exit 1)
      - uses: actions/upload-artifact@v4
        with: { name: site, path: dist, retention-days: 5 }

  audit:
    name: Accessibilité et performance
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Construction des images dérivées
        run: npm run media:build
      - name: Build sans chargement d'images à l'exécution
        run: npx astro build
        env:
          PUBLIC_DISABLE_RUNTIME_PHOTOS: '1'
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  links:
    name: Liens externes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Contrôler les sources et sites officiels
        run: node scripts/check-links.mjs --strict
